  <style>
    #crx-slab-v4{width:100%;font-family:Arial,Helvetica,sans-serif;color:#eee9e3;box-sizing:border-box}
    #crx-slab-v4 *{box-sizing:border-box}
    #crx-slab-v4 .crx-display{--crx-red:#9a1c36;position:relative;isolation:isolate;background:#080809;border-radius:18px;overflow:hidden}
    #crx-slab-v4 .crx-topline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:23px 25px 0;font-size:11px;letter-spacing:2px;color:#c4bdb8}
    #crx-slab-v4 .crx-wordmark{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:19px;letter-spacing:-1px;color:#f6f0e9}
    #crx-slab-v4 .crx-stage{height:487px;position:relative;display:grid;place-items:center;perspective:1050px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
    #crx-slab-v4 .crx-stage:active{cursor:grabbing}
    #crx-slab-v4 .crx-stage::before{content:'';position:absolute;width:350px;height:360px;max-width:94%;top:60px;background:radial-gradient(ellipse,rgba(111,21,40,.25),transparent 65%);pointer-events:none}
    #crx-slab-v4 .crx-stage::after{content:'';position:absolute;width:210px;height:22px;bottom:13px;border-radius:50%;background:#000;filter:blur(11px);pointer-events:none}
    #crx-slab-v4 .crx-slab{position:relative;width:264px;height:414px;transform-style:preserve-3d;transform:rotateX(-7deg) rotateY(-19deg);will-change:transform}
    #crx-slab-v4 .crx-rim{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
    #crx-slab-v4 .crx-rim-panel{position:absolute;left:0;top:0;transform-origin:center;backface-visibility:visible;background:linear-gradient(180deg,#e0cbd2 0%,#826d76 7%,#4b3a44 21%,#74606a 43%,#b6a3ac 48%,#5c4651 58%,#7b6871 86%,#c8b2bd 100%)}
    #crx-slab-v4 .crx-rim-panel::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#fff8f2,rgba(255,249,244,.3) 32%,rgba(255,249,244,.1) 64%,#fff7ef);opacity:var(--crx-edge-light,.08);pointer-events:none}
    #crx-slab-v4 .crx-face{position:absolute;inset:0;border:1px solid #baa4ad;border-radius:16px;background:linear-gradient(125deg,rgba(201,178,188,.24),rgba(101,72,86,.25) 34%,rgba(166,136,149,.18) 75%,rgba(216,194,202,.28));box-shadow:inset 0 0 0 3px rgba(225,210,217,.13),inset 0 0 0 7px rgba(0,0,0,.2),inset 0 0 14px rgba(213,177,188,.12);backface-visibility:hidden;-webkit-backface-visibility:hidden}
    #crx-slab-v4 .crx-front{transform:translateZ(10px)}
    #crx-slab-v4 .crx-back{transform:rotateY(180deg) translateZ(10px)}
    #crx-slab-v4 .crx-face{--crx-reflection:linear-gradient(var(--crx-light-angle,116deg),transparent calc(var(--crx-light-band,35%) - 23%),rgba(255,249,242,.025) calc(var(--crx-light-band,35%) - 15%),rgba(255,249,242,.2) calc(var(--crx-light-band,35%) - 5%),rgba(255,251,246,.78) var(--crx-light-band,35%),rgba(255,249,242,.17) calc(var(--crx-light-band,35%) + 4%),transparent calc(var(--crx-light-band,35%) + 17%)),radial-gradient(ellipse at var(--crx-light-x,35%) var(--crx-light-y,20%),rgba(255,234,222,.24),transparent 48%);--crx-field-width:262px;--crx-field-height:412px;--crx-card-x:-20px;--crx-card-y:-68px;--crx-label-x:-19px;--crx-label-y:-18px}
    #crx-slab-v4 .crx-face::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:16px;background-image:var(--crx-reflection);background-size:var(--crx-field-width) var(--crx-field-height);background-repeat:no-repeat;opacity:var(--crx-light-opacity,.55);box-shadow:inset 1px 1px 0 rgba(255,255,255,.7),inset -1px -1px 0 rgba(255,255,255,.3)}
    #crx-slab-v4 .crx-label,#crx-slab-v4 .crx-card{z-index:2}
    #crx-slab-v4 .crx-label::after,#crx-slab-v4 .crx-card::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;background-image:var(--crx-reflection);background-size:var(--crx-field-width) var(--crx-field-height);background-position:var(--crx-card-x) var(--crx-card-y);background-repeat:no-repeat;opacity:var(--crx-light-opacity,.55)}
    #crx-slab-v4 .crx-label::after{background-position:var(--crx-label-x) var(--crx-label-y);opacity:calc(var(--crx-light-opacity,.55) * .45)}
    #crx-slab-v4 .crx-label{position:absolute;top:15px;left:16px;right:16px;height:40px;display:grid;grid-template-columns:minmax(0,1fr) 34px;background:#ded9d0;border:3px solid var(--crx-red);border-radius:3px;color:#191419;box-shadow:0 2px 5px #0008}
    #crx-slab-v4 .crx-label-info{padding:0 8px;display:flex;align-items:center;min-width:0;overflow:hidden}
    #crx-slab-v4 .crx-label-title{font-size:11px;letter-spacing:.55px;font-weight:700;white-space:nowrap;line-height:1.2}
    #crx-slab-v4 .crx-label-code{font-family:'Courier New',monospace;font-size:12px;font-weight:600;letter-spacing:1.1px;white-space:nowrap}
    #crx-slab-v4 .crx-label-grade{display:flex;align-items:center;justify-content:center;border-left:1px solid #7c6f7260;font-family:Georgia,serif;font-size:26px;color:#67152b}
    #crx-slab-v4 .crx-front .crx-label{grid-template-columns:minmax(0,1fr) 40px}
    #crx-slab-v4 .crx-label-symbol img{display:block;width:30px;height:30px;max-width:none;object-fit:contain;pointer-events:none;filter:url(#crx-v4-label-ink)}
    #crx-slab-v4 .crx-card{position:absolute;top:67px;bottom:20px;left:19px;right:19px;border:1px solid #a14c5b;border-radius:8px;background:radial-gradient(ellipse at 50% 42%,#52202b 0,#251016 42%,#120d10 79%);color:#eaded3;overflow:hidden;box-shadow:0 1px 0 #eddac552,0 4px 12px #0009}
    #crx-slab-v4 .crx-card::before{content:'';position:absolute;inset:6px;border:1px solid #b6787047;border-radius:4px;pointer-events:none}
    #crx-slab-v4 .crx-long-logo{position:absolute;left:18px;top:18px;width:94px;height:26px;overflow:hidden;transform:scale(1.12);transform-origin:top left}
    #crx-slab-v4 .crx-long-logo img{position:absolute;left:-16.6px;top:-15.6px;width:127px;height:auto;max-width:none;pointer-events:none;filter:url(#crx-v4-circle-ink)}
    #crx-slab-v4 .crx-emblem{position:absolute;left:50%;top:60px;width:170px;height:170px;transform:translateX(-50%);display:grid;place-items:center}
    #crx-slab-v4 .crx-ring{position:absolute;border:1.15px solid #c49180;border-radius:50%;pointer-events:none}
    #crx-slab-v4 .crx-roman{position:relative;font-family:Georgia,'Times New Roman',serif;font-size:77px;line-height:1;font-weight:400;text-shadow:0 1px 0 #e8c6a2,0 3px 1px #17060c;color:#d4b69b;transform:translateY(-1px)}
    #crx-slab-v4 .crx-identity{position:absolute;left:16px;right:16px;bottom:24px;text-align:center}
    #crx-slab-v4 .crx-name{font-family:Georgia,'Times New Roman',serif;font-size:24px;letter-spacing:-.5px;color:#f0dfcb;white-space:nowrap;transform:translateY(2px)}
    #crx-slab-v4 .crx-date{font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;margin-top:10px;color:#d3b8ac}
    #crx-slab-v4 .crx-card-back{background:radial-gradient(ellipse at 50% 30%,#2e1820,#120e11 80%)}
    #crx-slab-v4 .crx-reverse-mark{position:absolute;top:25px;left:0;right:0;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:37px;line-height:1.15;font-weight:700;letter-spacing:-2px;color:#e6d6c7}
    #crx-slab-v4 .crx-eye-logo{position:absolute;top:81px;left:50%;transform:translateX(-50%);width:101px;height:30px;overflow:hidden;mix-blend-mode:screen;filter:sepia(.3) saturate(.6) brightness(.93)}
    #crx-slab-v4 .crx-eye-logo img{position:absolute;left:-5.6px;top:-12px;width:111px;height:auto;max-width:none;pointer-events:none}
    #crx-slab-v4 .crx-qr{position:absolute;left:31px;right:31px;top:125px;aspect-ratio:1;background:#e9d8c4;display:block;overflow:hidden;border-radius:2px;z-index:4;opacity:1}
    #crx-slab-v4 .crx-qr img{display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
    #crx-slab-v4 .crx-url{position:absolute;bottom:13px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.9px;color:#d0b7aa}
    #crx-slab-v4 .crx-actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:5px 16px 21px}
    #crx-slab-v4 .crx-actions button{display:inline-flex;justify-content:center;align-items:center;gap:7px;min-height:44px;padding:10px 15px;font:12px Arial,Helvetica,sans-serif;letter-spacing:.35px;border:1px solid #484044;border-radius:30px;background:#171317;color:#ede4df}
    #crx-slab-v4 .crx-actions button[aria-pressed=true]{background:#e9ddd2;color:#24161d;border-color:#e9ddd2}
    #crx-slab-v4 .crx-actions button:disabled{opacity:.4}
    #crx-slab-v4 .crx-actions button:hover{border-color:#9a717b}
    #crx-slab-v4 .crx-only-accessible{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    @media(max-width:390px){#crx-slab-v4 .crx-topline{padding:20px 16px 0;letter-spacing:1px}#crx-slab-v4 .crx-stage{height:472px}#crx-slab-v4 .crx-slab{width:250px;height:400px}#crx-slab-v4 .crx-emblem{top:57px;width:160px;height:160px}#crx-slab-v4 .crx-name{font-size:22px}#crx-slab-v4 .crx-identity{bottom:20px}}
    @media(prefers-reduced-motion:reduce){#crx-slab-v4 .crx-slab{will-change:auto}}
  </style>

  <script>

          face.style.setProperty('--crx-field-height', `${face.clientHeight || h-2}px`);
          face.style.setProperty('--crx-card-x', `${-(card.offsetLeft + card.clientLeft || 20)}px`);
          face.style.setProperty('--crx-card-y', `${-(card.offsetTop + card.clientTop || 68)}px`);
          face.style.setProperty('--crx-label-x', `${-(label.offsetLeft + label.clientLeft || 19)}px`);
          face.style.setProperty('--crx-label-y', `${-(label.offsetTop + label.clientTop || 18)}px`);
        });
        fitName();
        updateLighting();
      }
      let x = -7, y = -19, dragging = false, previousX = 0, previousY = 0;
      let automatic = false, frame = 0, turnFrame = 0, lastTime = 0;
      function updateLighting() {
        const pitch = x * Math.PI / 180;
        const yaw = y * Math.PI / 180;
        for(const [face,offset] of [[front,0],[back,180]]) {
          const localYaw = (y-offset) * Math.PI / 180;
          const side = Math.sin(localYaw), tilt = Math.sin(pitch);
          const facing = Math.abs(Math.cos(localYaw));
          face.style.setProperty('--crx-light-band', `${47 + side*74 + tilt*22}%`);
          face.style.setProperty('--crx-light-angle', `${115 + tilt*22 + side*11}deg`);
          face.style.setProperty('--crx-light-x', `${50 + side*42}%`);
          face.style.setProperty('--crx-light-y', `${18 + tilt*32}%`);
          face.style.setProperty('--crx-light-opacity', String(.46 + .26*(1-facing) + .05*(1+Math.cos(localYaw-.5))));
        }
        for(const edge of edgePanels) {
          const nx = edge.nx*Math.cos(yaw);
          const ny = edge.ny*Math.cos(pitch) + edge.nx*Math.sin(yaw)*Math.sin(pitch);
          const nz = edge.ny*Math.sin(pitch) - edge.nx*Math.sin(yaw)*Math.cos(pitch);
          const light = Math.max(0,-.55*nx-.65*ny+.52*nz);
          edge.element.style.setProperty('--crx-edge-light',String(.025 + .5*Math.pow(light,5)));
        }
      }
      function render() {
        slab.style.transition = 'none';
        slab.style.transform = `rotateX(${x}deg) rotateY(${y}deg)`;

        back.setAttribute('aria-hidden', String(onFront));

        cancelAnimationFrame(frame);
        cancelAnimationFrame(turnFrame);
        auto.setAttribute('aria-pressed', 'false');
        auto.textContent = 'Giro automático';

      }
      function turnTo(targetY) {
        const startX = x, startY = y;
        if(reduced.matches) { x=0; y=targetY; render(); return; }
        let startTime = null;
        const tick = time => {
          if(!root.isConnected) return;
          if(startTime === null) startTime = time;
          const progress = Math.min(1,(time-startTime)/650);
          const ease = 1-Math.pow(1-progress,3);
          x = startX*(1-ease);
          y = startY + (targetY-startY)*ease;
          render();
          if(progress<1) turnFrame = requestAnimationFrame(tick);
        };
        turnFrame = requestAnimationFrame(tick);
      }
      function spin(time) {
        if (!automatic || !root.isConnected) return;
        if (lastTime) y += Math.min(time - lastTime, 50) * .021;
        lastTime = time;
        render();
        frame = requestAnimationFrame(spin);
      }
      flip.addEventListener('click', () => {
        stop();
        const onFront = Math.cos(y * Math.PI / 180) >= 0;
        const target = onFront ? 180 : 0;
        let delta = ((target - y) % 360 + 360) % 360;
        if(delta > 180) delta -= 360;
        turnTo(y + delta);
        status.textContent = onFront ? 'Vista del reverso.' : 'Vista del anverso.';
      });
      auto.addEventListener('click', () => {
        if (automatic) { stop(); status.textContent = 'Giro pausado.'; return; }
        stop();
        automatic = true;
        auto.setAttribute('aria-pressed', 'true');
        auto.textContent = 'Pausar giro';
        status.textContent = 'Giro automático activado.';
        frame = requestAnimationFrame(spin);
      });

        if (event.button !== 0 || dragging) return;
        stop(); dragging = true;
        previousX = event.clientX; previousY = event.clientY;
        stage.setPointerCapture(event.pointerId);
        slab.style.transition = 'none';
      });
      stage.addEventListener('pointermove', event => {
        if (!dragging) return;
        y += (event.clientX - previousX) * .65;
        x = Math.max(-32, Math.min(32, x - (event.clientY - previousY) * .3));
        previousX = event.clientX; previousY = event.clientY;
        render();
      });
      function release() {
        if (!dragging) return;
        dragging = false;
        status.textContent = Math.cos(y * Math.PI / 180) >= 0 ? 'Vista del anverso.' : 'Vista del reverso.';
      }
      stage.addEventListener('pointerup', release);
      stage.addEventListener('pointercancel', release);
      stage.addEventListener('lostpointercapture', release);
      document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
      reduced.addEventListener('change', () => { stop(); auto.disabled = reduced.matches; });
      auto.disabled = reduced.matches;
      new ResizeObserver(buildRim).observe(slab);
      if(document.fonts) document.fonts.ready.then(fitName);
      buildRim(); render();
    })();
  </script>
</div>
