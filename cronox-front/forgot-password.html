<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | CRONOX</title>

  <!-- Opcional: estilos globales para tipografías / reset -->
  <link rel="stylesheet" href="assets/store.css?v=80">

  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --gray-100: #f5f5f5;
      --gray-300: #dcdcdc;
      --gray-700: #4a4a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
      color: var(--black);
    }

    .page {
      width: min(440px, 90vw);
      background: var(--white);
      border-radius: 0; /* esquinas en pico */
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .page__title {
      font-size: 28px;
      letter-spacing: 0.4px;
      text-align: center;
      margin-bottom: 10px;
      color: var(--black);
    }

    .page__subtitle {
      font-size: 15px;
      text-align: center;
      color: var(--gray-700);
      margin-bottom: 26px;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form__input {
      width: 100%;
      padding: 14px 12px;
      font-size: 15px;
      border: 1px solid #1b1b1b;
      border-radius: 0; /* esquinas en pico */
      background: var(--gray-100);
      color: #111111;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form__input:focus {
      outline: none;
      border-color: var(--black);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
    }

    .form__button {
      width: 100%;
      padding: 15px 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: var(--black);
      color: var(--white);
      border: none;
      border-radius: 0; /* esquinas en pico */
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .form__button:hover {
      opacity: 0.9;
    }

    .form__button:active {
      transform: translateY(1px);
    }

    .form__link {
      display: block;
      text-align: center;
      font-size: 13px;
      color: var(--gray-700);
      margin-top: 8px;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .form__link span {
      color: var(--black);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-decoration-color: var(--gray-700);
      transition: color 0.2s ease, text-decoration-color 0.2s ease;
    }

    .form__link:hover span {
      color: #0f0f0f;
      text-decoration-color: #0f0f0f;
    }

    @media (max-width: 480px) {
      .page {
        padding: 32px 26px;
      }

      .page__title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page" role="main">
    <h1 class="page__title">Recuperar contraseña</h1>
    <p class="page__subtitle">Introduce tu correo electrónico:</p>

    <!-- 🔴 AQUÍ ESTÁ EL CAMBIO IMPORTANTE: /api/auth/... -->
    <form class="form" action="/api/auth/forgot-password" method="POST" novalidate>
      <input
        type="email"
        name="email"
        class="form__input"
        placeholder="Correo electrónico"
        required
      >

      <button type="submit" class="form__button">Recuperar</button>

      <!-- Volver al inicio de sesión: queremos que se abra el modal de login -->
      <a class="form__link" href="#" id="backToLogin">
        ¿Recuerdas tu contraseña? <span>Volver al inicio de sesión</span>
      </a>
    </form>
  </main>

  <script>
    (function () {
      const AUTH_MODAL_KEY = 'cronox_open_auth_on_load';
      const backLink = document.getElementById('backToLogin');

      // Volver al inicio de sesión → marcar que queremos abrir el modal y volver a index
      if (backLink) {
        backLink.addEventListener('click', function (event) {
          event.preventDefault();
          try {
            localStorage.setItem(AUTH_MODAL_KEY, 'login');
          } catch (err) {
            console.warn('No se pudo usar localStorage', err);
          }
          window.location.href = 'index.html';
        });
      }

      // Click fuera del recuadro blanco → volver a la web
      document.addEventListener('click', function (event) {
        const card = document.querySelector('.page');
        if (!card) return;
        if (!card.contains(event.target)) {
          window.location.href = 'index.html';
        }
      });

      // ESC → volver a la web
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          window.location.href = 'index.html';
        }
      });
    })();
  </script>
</body>
</html>
