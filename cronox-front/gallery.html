<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galer&iacute;a | CRONOX</title>
    <meta
      name="description"
      content="Galer&iacute;a visual de la comunidad CRONOX."
    />
    <link rel="stylesheet" href="assets/cookie-consent.css?v=1" />
    <link rel="stylesheet" href="assets/store.css?v=89" />
    <link rel="stylesheet" href="assets/info-page.css?v=2" />
    <link rel="stylesheet" href="assets/gallery.css?v=14" />
    <script src="assets/cookie-consent.js?v=3" defer></script>
    <script src="assets/customer-analytics.js?v=1" defer></script>
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/favicon.png?v=3" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body class="page-info page-gallery">
    <script src="assets/info-shell.js?v=1"></script>
    <main class="gallery-page">
      <h1 class="gallery-visually-hidden">GALER&Iacute;A</h1>
      <section
        id="galleryGrid"
        class="gallery-grid"
        data-gallery-root
        aria-label="Galer&iacute;a CRONOX"
      ></section>
    </main>
    <div
      id="galleryLightbox"
      class="gallery-lightbox"
      role="dialog"
      aria-modal="true"
      aria-labelledby="galleryLightboxTitle"
      aria-hidden="true"
      hidden
    >
      <h2 id="galleryLightboxTitle" class="gallery-visually-hidden">
        Visor de la galer&iacute;a CRONOX
      </h2>
      <button
        id="galleryLightboxClose"
        class="gallery-lightbox__control gallery-lightbox__close"
        type="button"
        aria-label="Cerrar visor"
      >
        &times;
      </button>
      <button
        id="galleryLightboxPrevious"
        class="gallery-lightbox__control gallery-lightbox__arrow gallery-lightbox__arrow--previous"
        type="button"
        aria-label="Ver foto anterior"
      >
        &#8249;
      </button>
      <div class="gallery-lightbox__composition" data-lightbox-composition>
        <div id="galleryLightboxStage" class="gallery-lightbox__stage">
          <div
            id="galleryLightboxLoading"
            class="gallery-lightbox__loading"
            role="status"
            aria-live="polite"
          >
            Cargando imagen&hellip;
          </div>
          <img
            id="galleryLightboxImage"
            class="gallery-lightbox__image"
            alt=""
          />
          <a
            id="galleryLightboxInstagramOverlay"
            class="gallery-lightbox__instagram gallery-lightbox__instagram--overlay"
            target="_blank"
            rel="noopener noreferrer"
            hidden
          >
            Instagram &#8599;
          </a>
        </div>
        <aside id="galleryLightboxInfo" class="gallery-lightbox__info" hidden>
          <div
            id="galleryLightboxProducts"
            class="gallery-lightbox__products"
          ></div>
          <p
            id="galleryLightboxDescription"
            class="gallery-lightbox__description"
          ></p>
          <a
            id="galleryLightboxInstagramInfo"
            class="gallery-lightbox__instagram gallery-lightbox__instagram--info"
            target="_blank"
            rel="noopener noreferrer"
            hidden
          >
            VER PUBLICACI&Oacute;N EN INSTAGRAM
          </a>
        </aside>
      </div>
      <button
        id="galleryLightboxNext"
        class="gallery-lightbox__control gallery-lightbox__arrow gallery-lightbox__arrow--next"
        type="button"
        aria-label="Ver foto siguiente"
      >
        &#8250;
      </button>
    </div>
    <script src="assets/api.js?v=4"></script>
    <script src="assets/app.js?v=61" defer></script>
    <script src="assets/cart-badge.js?v=43" defer></script>
    <script src="assets/gallery.js?v=10" defer></script>
  </body>
</html>
