<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/cookie-consent.css?v=1" />
  <script src="assets/cookie-consent.js?v=3" defer></script>
  <script src="assets/customer-analytics.js?v=1" defer></script>
  <meta name="referrer" content="no-referrer">
  <title>Restablecer contraseña | CRONOX</title>

  <link id="cronox-main-style" rel="stylesheet" href="">
  <script src="assets/version.js?v=89"></script>
  <script>
    (function () {
      if (window.CRONOX_ASSET) {
        const link = document.getElementById('cronox-main-style');
        if (link) {
          link.href = window.CRONOX_ASSET('assets/store.css');
        }
      }
    })();
  </script>

  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --gray-100: #f5f5f5;
      --gray-300: #dcdcdc;
      --gray-700: #4a4a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--black);
      color: var(--black);
    }

    .page {
      width: min(440px, 100%);
      background: var(--white);
      border-radius: 0;
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .page__title {
      font-size: 28px;
      letter-spacing: 0.4px;
      text-align: center;
      margin-bottom: 10px;
      color: var(--black);
    }

    .page__subtitle {
      font-size: 15px;
      text-align: center;
      color: var(--gray-700);
      margin-bottom: 26px;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form__input {
      width: 100%;
      padding: 14px 12px;
      font-size: 15px;
      border: 1px solid #1b1b1b;
      border-radius: 0;
      background: var(--gray-100);
      color: #111111;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form__input:focus {
      outline: none;
      border-color: var(--black);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
    }

    .form__button {
      width: 100%;
      padding: 15px 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: var(--black);
      color: var(--white);
      border: none;
      border-radius: 0;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .form__button:hover {
      opacity: 0.9;
    }

    .form__button:active {
      transform: translateY(1px);
    }

    .form__message {
      font-size: 14px;
      min-height: 18px;
      line-height: 1.4;
    }

    .form__message--error {
      color: #b00020;
    }

    .form__message--success {
      color: #1b5e20;
    }

    .form__helper {
      font-size: 13px;
      color: var(--gray-700);
      text-align: center;
      margin-top: 4px;
    }

    @media (max-width: 480px) {
      .page {
        padding: 32px 26px;
      }

      .page__title {
        font-size: 24px;
      }
    }

    @media (max-height: 560px) {
      body { align-items: flex-start; }
    }
  </style>
  <link rel="icon" type="image/png" href="/favicon.png?v=3">
  <link rel="shortcut icon" type="image/png" href="/favicon.png?v=3">
  <link rel="apple-touch-icon" href="/favicon.png?v=3">
  <meta name="theme-color" content="#000000">
</head>
<body>
  <main class="page" role="main">
    <h1 class="page__title">Restablecer contraseña</h1>
    <p class="page__subtitle">Introduce tu nueva contraseña:</p>

    <form class="form" id="resetForm" novalidate>
      <input
        type="password"
        name="password"
        class="form__input"
        placeholder="Nueva contraseña"
        required
      >

      <input
        type="password"
        name="passwordConfirm"
        class="form__input"
        placeholder="Repite la nueva contraseña"
        required
      >

      <p id="resetMessage" class="form__message" aria-live="polite"></p>

      <button type="submit" class="form__button">Restablecer contraseña</button>

      <p class="form__helper">Asegúrate de que sea segura y fácil de recordar.</p>
    </form>
  </main>

  <script src="assets/api.js"></script>
  <script>
    (function () {
      const resetUrl = new URL(window.location.href);
      const token = resetUrl.searchParams.get('token');
      if (token) {
        resetUrl.searchParams.delete('token');
        window.history.replaceState(null, document.title, `${resetUrl.pathname}${resetUrl.search}${resetUrl.hash}`);
      }

      const form = document.getElementById('resetForm');
      const messageEl = document.getElementById('resetMessage');
      const submitButton = form.querySelector('button[type="submit"]');
      const inputs = Array.from(form.querySelectorAll('input'));
      const apiBase = window.CRONOX_API?.API_BASE || '';
      const resetEndpoint = apiBase ? `${apiBase}/api/auth/reset-password` : '/api/auth/reset-password';
      const getCsrfHeaders = async () => {
        const provider = window.CRONOX_API?.getCsrfHeaders;
        return typeof provider === 'function' ? provider() : {};
      };

      function setMessage(text, type = 'error') {
        messageEl.textContent = text;
        messageEl.classList.remove('form__message--error', 'form__message--success');

        if (type === 'success') {
          messageEl.classList.add('form__message--success');
        } else if (type === 'error') {
          messageEl.classList.add('form__message--error');
        }
      }

      if (!token) {
        setMessage('El enlace de recuperación no es válido o ha caducado. Vuelve a solicitarlo desde "¿Olvidaste tu contraseña?".');
        submitButton.disabled = true;
        inputs.forEach((input) => input.setAttribute('disabled', 'true'));
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const password = form.password.value.trim();
        const passwordConfirm = form.passwordConfirm.value.trim();

        submitButton.disabled = true;
        submitButton.textContent = 'Actualizando...';

        if (!password || password.length < 8) {
          setMessage('La contraseña debe tener al menos 8 caracteres.');
          submitButton.disabled = false;
          submitButton.textContent = 'Restablecer contraseña';
          return;
        }

        if (password !== passwordConfirm) {
          setMessage('Las contraseñas no coinciden.');
          submitButton.disabled = false;
          submitButton.textContent = 'Restablecer contraseña';
          return;
        }

        setMessage('', 'success');

        try {
          const res = await fetch(resetEndpoint, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json', ...(await getCsrfHeaders()) },
            body: JSON.stringify({ token, password }),
          });

          if (!res.ok) {
            const data = await res.json().catch(() => null);
            setMessage(data?.message || 'No se ha podido cambiar la contraseña.', 'error');
            submitButton.disabled = false;
            submitButton.textContent = 'Restablecer contraseña';
            return;
          }

          try {
            localStorage.setItem('cronox_open_auth_on_load', 'login');
          } catch (err) {
            console.warn('No se pudo escribir cronox_open_auth_on_load', err);
          }

          setMessage('Tu contraseña se ha actualizado correctamente. Te llevamos al inicio de sesión...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 900);
        } catch (err) {
          console.error(err);
          setMessage('Error de conexión. Inténtalo de nuevo.', 'error');
          submitButton.disabled = false;
          submitButton.textContent = 'Restablecer contraseña';
        }
      });
    })();
  </script>
</body>
</html>
