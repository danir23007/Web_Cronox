<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña | CRONOX</title>

  <link rel="stylesheet" href="assets/store.css?v=21">

  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --gray-100: #f5f5f5;
      --gray-300: #dcdcdc;
      --gray-700: #4a4a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
      color: var(--black);
    }

    .page {
      width: min(440px, 90vw);
      background: var(--white);
      border-radius: 0;
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .page__title {
      font-size: 28px;
      letter-spacing: 0.4px;
      text-align: center;
      margin-bottom: 10px;
      color: var(--black);
    }

    .page__subtitle {
      font-size: 15px;
      text-align: center;
      color: var(--gray-700);
      margin-bottom: 26px;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form__input {
      width: 100%;
      padding: 14px 12px;
      font-size: 15px;
      border: 1px solid #1b1b1b;
      border-radius: 0;
      background: var(--gray-100);
      color: #111111;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form__input:focus {
      outline: none;
      border-color: var(--black);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
    }

    .form__button {
      width: 100%;
      padding: 15px 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: var(--black);
      color: var(--white);
      border: none;
      border-radius: 0;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .form__button:hover {
      opacity: 0.9;
    }

    .form__button:active {
      transform: translateY(1px);
    }

    .form__message {
      font-size: 14px;
      color: #b00020;
      min-height: 18px;
    }

    @media (max-width: 480px) {
      .page {
        padding: 32px 26px;
      }

      .page__title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page" role="main">
    <h1 class="page__title">Restablecer contraseña</h1>
    <p class="page__subtitle">Introduce tu nueva contraseña:</p>

    <form class="form" id="resetForm" novalidate>
      <input
        type="password"
        name="password"
        class="form__input"
        placeholder="Nueva contraseña"
        required
      >

      <input
        type="password"
        name="passwordConfirm"
        class="form__input"
        placeholder="Repite la nueva contraseña"
        required
      >

      <p id="resetMessage" class="form__message"></p>

      <button type="submit" class="form__button">Restablecer contraseña</button>
    </form>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      const form = document.getElementById('resetForm');
      const messageEl = document.getElementById('resetMessage');

      if (!token) {
        messageEl.textContent = 'Token de recuperación no encontrado. Vuelve a solicitar el enlace.';
        form.querySelector('button[type="submit"]').disabled = true;
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const password = form.password.value.trim();
        const passwordConfirm = form.passwordConfirm.value.trim();

        if (!password || password.length < 8) {
          messageEl.textContent = 'La contraseña debe tener al menos 8 caracteres.';
          return;
        }

        if (password !== passwordConfirm) {
          messageEl.textContent = 'Las contraseñas no coinciden.';
          return;
        }

        messageEl.textContent = '';

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password }),
          });

          if (!res.ok) {
            const data = await res.json().catch(() => null);
            messageEl.textContent = data?.message || 'No se ha podido cambiar la contraseña.';
            return;
          }

          try {
            localStorage.setItem('cronox_open_auth_on_load', 'login');
          } catch (err) {
            console.warn('No se pudo escribir cronox_open_auth_on_load', err);
          }

          window.location.href = 'index.html';
        } catch (err) {
          console.error(err);
          messageEl.textContent = 'Error de conexión. Inténtalo de nuevo.';
        }
      });
    })();
  </script>
</body>
</html>
