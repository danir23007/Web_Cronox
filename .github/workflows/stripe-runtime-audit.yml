name: Audit CRONOX Stripe runtime
on:
  push:
    branches: [maintenance/stripe-checkout-verification]
    paths: [.github/workflows/stripe-runtime-audit.yml]
permissions:
  contents: read
concurrency:
  group: cronox-stripe-maintenance
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read runtime configuration without exposing credentials
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CRONOX_VPS_HOST }}
          username: ${{ secrets.CRONOX_VPS_USER }}
          key: ${{ secrets.CRONOX_VPS_SSH_KEY }}
          port: ${{ secrets.CRONOX_VPS_PORT }}
          script: |
            set -eu
            node <<'NODE'
            const fs = require('node:fs');
            const path = require('node:path');
            const cp = require('node:child_process');
            (async () => {
              const app = JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8'})).find(x=>x.name==='cronox');
              if (!app) throw new Error('CRONOX_PROCESS_NOT_FOUND');
              const cwd=app.pm2_env.pm_cwd;
              const envPath=path.join(cwd,'.env');
              const dotenv=require(path.join(cwd,'node_modules/dotenv'));
              const file=dotenv.parse(fs.readFileSync(envPath));
              const env={...file,...app.pm2_env.env};
              const key=env.STRIPE_SECRET_KEY;
              const res=await fetch('https://api.stripe.com/v1/account',{headers:{Authorization:'Bearer '+key}});
              if(!res.ok) throw new Error('STRIPE_ACCOUNT_LOOKUP_FAILED_'+res.status);
              const account=await res.json();
              console.log(JSON.stringify({cwd,envPath,script:app.pm2_env.pm_exec_path,status:app.pm2_env.status,nodeEnv:env.NODE_ENV||'development',stripeMode:key?.startsWith('sk_test_')?'test':key?.startsWith('sk_live_')?'live':'unknown',stripeAccountId:account.id,frontendUrl:env.FRONTEND_URL,apiPublicUrl:env.API_PUBLIC_URL||null,webhookSecretConfigured:!!env.STRIPE_WEBHOOK_SECRET,pm2HasStripeKey:!!app.pm2_env.env?.STRIPE_SECRET_KEY,pm2HasWebhookSecret:!!app.pm2_env.env?.STRIPE_WEBHOOK_SECRET,envIsSymlink:fs.lstatSync(envPath).isSymbolicLink(),envRealPath:fs.realpathSync(envPath)}));
            })().catch(e=>{console.error(e.message);process.exit(1)});
            NODE
