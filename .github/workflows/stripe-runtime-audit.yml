name: Audit CRONOX Stripe runtime
on:
  push:
    branches: [maintenance/stripe-checkout-verification]
    paths: [.github/workflows/stripe-runtime-audit.yml]
permissions:
  contents: read
concurrency:
  group: cronox-stripe-maintenance
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read runtime configuration without exposing credentials
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CRONOX_VPS_HOST }}
          username: ${{ secrets.CRONOX_VPS_USER }}
          key: ${{ secrets.CRONOX_VPS_SSH_KEY }}
          port: ${{ secrets.CRONOX_VPS_PORT }}
          script: |
            set -eu
            node <<'NODE'
            const fs = require('node:fs');
            const path = require('node:path');
            const cp = require('node:child_process');
            let stage='PROCESS_LOOKUP';
            (async () => {
              const raw=cp.execFileSync('pm2',['jlist'],{encoding:'utf8'});
              let apps;
              for(let i=raw.indexOf('[');i>=0;i=raw.indexOf('[',i+1)){try{const v=JSON.parse(raw.slice(i));if(Array.isArray(v)){apps=v;break;}}catch{}}
              if(!apps) throw new Error('PM2_JSON_PARSE_FAILED');
              if(apps.length===0){
                stage='SERVICE_OWNER_LOOKUP';
                const rootRaw=cp.execFileSync('sudo',['-n','pm2','jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']});
                for(let i=rootRaw.indexOf('[');i>=0;i=rootRaw.indexOf('[',i+1)){try{const v=JSON.parse(rootRaw.slice(i));if(Array.isArray(v)){apps=v;break;}}catch{}}
              }
              if(apps.length===0) throw new Error('PM2_PROCESS_LIST_EMPTY');
              const matches=apps.filter(x=>/cronox/i.test([x.name,x.pm2_env?.name,x.pm2_env?.pm_cwd,x.pm2_env?.pm_exec_path].join(' ')));
              if(matches.length!==1) throw new Error('CRONOX_PROCESS_SELECTION_FAILED');
              const app=matches[0];
              if (!app) throw new Error('CRONOX_PROCESS_NOT_FOUND');
              stage='READ_APPLICATION_CONFIG';
              const cwd=app.pm2_env.pm_cwd;
              const envPath=path.join(cwd,'.env');
              const dotenv=require(path.join(cwd,'node_modules/dotenv'));
              const file=dotenv.parse(fs.readFileSync(envPath));
              const env={...file,...app.pm2_env.env};
              const key=env.STRIPE_SECRET_KEY;
              stage='STRIPE_ACCOUNT_CHECK';
              const res=await fetch('https://api.stripe.com/v1/account',{headers:{Authorization:'Bearer '+key}});
              if(!res.ok) throw new Error('STRIPE_ACCOUNT_LOOKUP_FAILED_'+res.status);
              const account=await res.json();
              if(account.id!=='acct_1SPoZCFk1nGlnJwa'||!key.startsWith('sk_test_')) throw new Error('TEST_ACCOUNT_MISMATCH');
              if(env.NODE_ENV==='production') throw new Error('TEST_MODE_INCOMPATIBLE_WITH_PRODUCTION');
              console.log('STRIPE_TEST_CONFIGURATION_VERIFIED');
            })().catch(e=>{console.error(/^[A-Z0-9_]+$/.test(e.message)?e.message:stage+'_FAILED');process.exit(1)});
            NODE
