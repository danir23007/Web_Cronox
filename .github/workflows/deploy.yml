name: Deploy CRONOX

on:
  push:
    branches:
      - main

concurrency:
  group: cronox-production
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci_export_test:ci_export_test@127.0.0.1:1/cronox_ci_export_test
      JWT_ACCESS_SECRET: ci-only-access-jwt-value-7f21a9c4b6038d52
      JWT_REFRESH_SECRET: ci-only-refresh-jwt-value-91e6c2a8475b3d08
      STRIPE_SECRET_KEY: sk_test_ci_only_not_a_real_stripe_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_only_not_a_real_webhook_secret
      FRONTEND_URL: http://127.0.0.1:43119
      API_PUBLIC_URL: http://127.0.0.1:43119
      CORS_ORIGINS: http://127.0.0.1:43119
      EMAIL_ENABLED: 'false'
      ENABLE_SWAGGER: 'false'
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v5

      - name: Use production Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cronox-backend/package-lock.json

      - name: Install frontend build dependencies exactly
        run: npm ci

      - name: Install backend dependencies, including ExcelJS, exactly
        run: npm ci --prefix cronox-backend

      - name: Generate the Prisma client
        run: npm run prisma:generate --prefix cronox-backend

      - name: Build matching frontend and backend artifacts
        run: |
          set -euo pipefail
          npm run admin:build
          npm run build:compiled --prefix cronox-backend

      - name: Verify Excel HTTP routes, filters, workbooks and artifacts
        run: |
          set -euo pipefail
          npm run test:exports:ci --prefix cronox-backend
          npm run smoke:exports:artifacts --prefix cronox-backend
          npm run smoke:exports:compiled --prefix cronox-backend

  deploy:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CRONOX_VPS_HOST }}
          username: ${{ secrets.CRONOX_VPS_USER }}
          key: ${{ secrets.CRONOX_VPS_SSH_KEY }}
          port: ${{ secrets.CRONOX_VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            /var/www/cronox/deploy.sh
            status="$(curl --silent --show-error --output /tmp/cronox-export-smoke.json --write-out '%{http_code}' 'http://127.0.0.1:3000/api/admin/exports/users?scope=all')"
            if [ "$status" != "401" ] && [ "$status" != "429" ]; then
              echo "Admin export route smoke failed with HTTP $status"
              sed -n '1,5p' /tmp/cronox-export-smoke.json
              exit 1
            fi
